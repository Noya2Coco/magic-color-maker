<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coloriage magique</title>
<style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;color:#171717;background:#f5f5f5}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}img{max-width:100%;border:1px solid #ddd;border-radius:12px;background:#fff}label{display:block;font-weight:650;margin:10px 0 5px}input,select,button{font:inherit}input[type=number],select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:9px}button,.download{display:inline-block;border:0;border-radius:10px;background:#161616;color:#fff;padding:11px 14px;margin:5px 5px 5px 0;text-decoration:none;cursor:pointer}button.secondary{background:#666}.step{display:none}.step.active{display:block}.palette{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.swatch{width:34px;height:34px;border:1px solid #555;border-radius:7px}.muted{color:#666}.ok{background:#edf9ee;border:1px solid #a9d9ad;padding:10px;border-radius:10px}.error{background:#fff0f0;border:1px solid #e2a6a6;padding:10px;border-radius:10px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.toolbar>div{flex:1 1 180px}h1{margin-bottom:4px}small{color:#666}
</style>
</head>
<body><div class="wrap">
<h1>🖍️ Générateur de coloriage magique</h1><div class="muted">Version légère Termux — aucun Streamlit/Pandas.</div>
<div id="msg"></div>

<section class="card step active" id="step1">
<h2>1. Image et limites</h2>
<label>Choisir une image</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<div class="toolbar">
<div><label>Valeur maximale / couleurs max</label><input id="maxValue" type="number" min="2" max="50" value="10"></div>
<div><label>Couleurs proposées</label><input id="targetColors" type="number" min="2" max="50" value="8"></div>
</div>
<button onclick="uploadAndSimplify()">Analyser et simplifier</button>
</section>

<section class="card step" id="step2">
<h2>2. Validation de la simplification</h2>
<div class="grid"><div><b>Originale</b><br><img id="original"></div><div><b>Simplifiée</b><br><img id="simplified"></div></div>
<p id="colorStats"></p><div id="palette" class="palette"></div>
<div class="toolbar"><div><label>Nombre de couleurs</label><input id="targetColors2" type="number" min="2" value="8"></div></div>
<button class="secondary" onclick="resimplify(-1)">Moins détaillé</button><button class="secondary" onclick="resimplify(1)">Plus détaillé</button><button onclick="validateSimplification()">✅ Cette simplification me convient</button>
</section>

<section class="card step" id="step3">
<h2>3. Cellules</h2>
<label>Complexité</label><select id="complexity"><option value="650">Très simple</option><option value="350" selected>Simple</option><option value="150">Moyen</option><option value="50">Détaillé</option></select>
<button onclick="detectRegions()">Détecter les cellules</button>
<p id="regionStats"></p><img id="regionPreview">
<div><button onclick="validateRegions()">✅ Valider les cellules</button></div>
</section>

<section class="card step" id="step4">
<h2>4. Exercices</h2>
<div class="toolbar">
<div><label>Mode</label><select id="mode"><option>Nombre</option><option>Addition</option><option>Soustraction</option><option>Multiplication</option><option>Division</option><option>Mélange</option></select></div>
<div><label>Opérande maximum</label><input id="operandMax" type="number" min="1" value="10"></div>
<div><label>Seed</label><input id="seed" type="number" min="0" value="42"></div>
</div>
<button onclick="generate()">Générer</button><button class="secondary" onclick="regen()">🎲 Régénérer les calculs</button>
<div class="grid"><div><b>Version élève</b><br><img id="student"></div><div><b>Corrigé</b><br><img id="corrected"></div></div>
<div id="legend" class="palette"></div>
<div id="downloads" style="display:none;margin-top:12px"><a class="download" id="dPng">PNG</a><a class="download" id="dSvg">SVG</a><a class="download" id="dPdf">PDF</a><a class="download" id="dCorrected">Corrigé PNG</a></div>
</section>
</div>
<script>
let sid=null;
const $=id=>document.getElementById(id);
function show(n){for(let i=1;i<=4;i++)$('step'+i).classList.toggle('active',i<=n)}
function message(text,error=false){$('msg').innerHTML=`<div class="${error?'error':'ok'}">${text}</div>`}
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erreur');return j}
function fileData(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}
function renderPalette(colors){$('palette').innerHTML=colors.map(c=>`<span class="swatch" title="rgb(${c.join(',')})" style="background:rgb(${c.join(',')})"></span>`).join('')}
async function uploadAndSimplify(){try{const f=$('file').files[0];if(!f)throw new Error('Choisis une image.');const max=+$('maxValue').value;let target=Math.min(+$('targetColors').value,max);const up=await api('/api/upload',{image:await fileData(f)});sid=up.session;$('original').src=up.original;$('targetColors2').max=max;$('targetColors2').value=target;$('operandMax').value=max;await simplify(target);show(2);message('Simplification prête : compare les deux images puis valide.')}catch(e){message(e.message,true)}}
async function simplify(target){const max=+$('maxValue').value;target=Math.max(2,Math.min(target,max));$('targetColors2').value=target;const j=await api('/api/simplify',{session:sid,target_colors:target,max_value:max});$('simplified').src=j.simplified;$('colorStats').textContent=`${j.count} couleur(s) / maximum ${j.max_value}`;renderPalette(j.colors)}
async function resimplify(delta){try{await simplify(+$('targetColors2').value+delta)}catch(e){message(e.message,true)}}
function validateSimplification(){show(3);message('Simplification validée. Tu peux maintenant contrôler les cellules.');detectRegions()}
async function detectRegions(){try{const j=await api('/api/regions',{session:sid,min_area:+$('complexity').value});$('regionPreview').src=j.preview;$('regionStats').textContent=`${j.region_count} cellule(s) détectée(s) • ${j.small_labels} zone(s) avec peu de place pour le texte.`}catch(e){message(e.message,true)}}
function validateRegions(){show(4);message('Cellules validées. Configure maintenant les calculs puis génère.');generate()}
async function generate(){try{const j=await api('/api/generate',{session:sid,mode:$('mode').value,operand_max:+$('operandMax').value,seed:+$('seed').value});$('student').src=j.student;$('corrected').src=j.corrected;$('legend').innerHTML=j.palette.map(p=>`<span style="display:flex;align-items:center;gap:5px"><span class="swatch" style="background:rgb(${p.color.join(',')})"></span><b>= ${p.value}</b></span>`).join('');$('dPng').href=`/download/${sid}/png`;$('dSvg').href=`/download/${sid}/svg`;$('dPdf').href=`/download/${sid}/pdf`;$('dCorrected').href=`/download/${sid}/corrige.png`;$('downloads').style.display='block'}catch(e){message(e.message,true)}}
function regen(){$('seed').value=+$('seed').value+1;generate()}
</script></body></html>
